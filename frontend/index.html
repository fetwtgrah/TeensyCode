<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeensyCode</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">Tc</span>
      <div class="brand-text">
        <strong>TeensyCode</strong>
        <small>本地工作台 · workplace</small>
      </div>
    </div>
    <div class="top-actions">
      <span id="mcp-status" class="pill"><i class="dot"></i><span id="mcp-label">检查联网…</span></span>
      <span id="run-status" class="run-status" aria-live="polite"></span>
      <button id="new-chat" type="button" class="btn ghost">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新对话
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="files">
      <div class="pane-title">
        <span>文件</span>
        <button id="refresh-files" type="button" class="icon-btn" title="刷新">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="chat">
      <div id="transcript" class="transcript">
        <div id="empty" class="empty">
          <p class="empty-kicker">local work--FRESH</p>
          <p class="empty-sub">Agent 可以读文件、搜索、写入和跑命令。</p>
          <div class="chips">
            <button type="button" data-prompt="读取 agent_intro.html，用三句话概括它在讲什么。">概括介绍页</button>
            <button type="button" data-prompt="列出工作目录里的文件，并说明每个文件大概是做什么的。">看看目录</button>
            <button type="button" data-prompt="在工作目录里搜索 TODO，如果没有就直接告诉我。">找 TODO</button>
          </div>
        </div>
      </div>
      <button id="scroll-bottom" type="button" title="滚动到底部" aria-label="滚动到底部">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
      <p id="banner" class="banner" hidden></p>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="描述你想让 agent 做的事"></textarea>
        <div class="composer-bar">
          <span class="hint">Enter 发送 · Shift+Enter 换行</span>
          <button id="send" type="submit" class="btn primary">发送</button>
        </div>
      </form>
    </section>

    <aside id="preview" class="preview" hidden>
      <div class="pane-title">
        <span id="preview-path"></span>
        <div class="pane-actions">
          <button id="preview-copy" type="button" class="icon-btn" title="复制">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button id="preview-close" type="button" class="icon-btn" title="关闭">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <pre id="preview-body"></pre>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
